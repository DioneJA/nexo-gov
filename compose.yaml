name: nexogov-local
services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXOGOV_DB_NAME:-nexogov_dev}
      POSTGRES_USER: ${NEXOGOV_DB_USERNAME:-nexogov_dev}
      POSTGRES_PASSWORD: ${NEXOGOV_DB_PASSWORD:-nexogov-local-only}
    ports:
      - "127.0.0.1:${NEXOGOV_DB_PORT:-55433}:5432"
    volumes:
      - nexogov_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXOGOV_DB_USERNAME:-nexogov_dev} -d ${NEXOGOV_DB_NAME:-nexogov_dev}"]
      interval: 5s
      timeout: 3s
      retries: 15
  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${NEXOGOV_STORAGE_BUCKET:-nexogov-private-documents}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:${NEXOGOV_STORAGE_PORT:-55434}:9090"
    volumes:
      - nexogov_s3mockdata:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  nexogov_pgdata:
  nexogov_s3mockdata:
